<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><meta name="description" content="Join friends in Drop Zone Online, a real-time multiplayer arena game."><link rel="manifest" href="/manifest.webmanifest"><title>Drop Zone Online</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1a2430;--line:#334252;--lime:#c8f169;--muted:#9baaba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#283746,#10151d 60%);color:#f2f5f8;font:16px system-ui,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(1040px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:var(--lime)}.tag{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#18222ddd;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 14px 40px #0005}.panel h1{font-size:27px;margin:0 0 6px}.panel p{color:var(--muted);line-height:1.5;margin:0 0 18px}.field{width:100%;background:#101820;color:white;border:1px solid var(--line);border-radius:9px;padding:12px;margin:0 0 10px;font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:var(--lime);color:#17200d;padding:12px 16px;font-weight:800;font:inherit}.wide{width:100%}.secondary{background:#273442;color:#e8eff7;margin-top:8px}.players{margin-top:18px;color:var(--muted);font-size:14px}.stage{min-width:0}.hud{display:flex;justify-content:space-between;align-items:center;margin:0 3px 9px;color:var(--muted);font-size:14px}.arena{position:relative;background:#121b20;border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:900/560;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(circle at 50% 50%,#273d2d,#14201e 65%);background-size:40px 40px,40px 40px,auto}.safe{position:absolute;inset:12%;border:2px dashed #c8f16955;border-radius:50%;pointer-events:none}.player{position:absolute;width:30px;height:30px;border:3px solid white;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px currentColor;z-index:2}.player.me{border-color:var(--lime);width:35px;height:35px}.label{position:absolute;transform:translate(-50%,-150%);font-size:11px;white-space:nowrap;text-shadow:0 2px 5px black}.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#dbe5ee;background:#101820bb;padding:24px}.msg strong{display:block;color:var(--lime);font-size:21px;margin-bottom:6px}.controls{color:var(--muted);font-size:13px;margin:10px 3px}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{order:2}.stage{order:1}header{align-items:flex-start;gap:8px;flex-direction:column}}
<style>.arena{touch-action:none}.touch-controls{display:none;justify-content:space-between;align-items:center;margin:10px 2px 0;touch-action:none}.touch-pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}.touch-key,.fire-key{background:#263342;color:#f4f7fb;border:1px solid #58697a;border-radius:12px;font-size:20px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}.touch-key[data-key="w"]{grid-column:2}.touch-key[data-key="a"]{grid-column:1;grid-row:2}.touch-key[data-key="s"]{grid-column:2;grid-row:2}.touch-key[data-key="d"]{grid-column:3;grid-row:2}.fire-key{background:#c8f169;color:#17200d;width:96px;height:96px;border-radius:50%;font-size:16px}@media(max-width:760px){body{padding:12px}.touch-controls{display:flex}.controls{font-size:11px}}</style></head>
<body><main class="app"><header><div class="brand">DROP <span>ZONE</span> / ONLINE</div><div class="tag">REAL-TIME MULTIPLAYER ARENA</div></header><div class="layout"><aside class="panel"><h1>Join the drop</h1><p>Choose a name, then join the open arena. Share this site link so friends can play too.</p><input id="name" class="field" maxlength="16" placeholder="Your player name"><button id="join" class="wide">JOIN ARENA</button><button id="leave" class="wide secondary hidden">LEAVE MATCH</button><div class="players" id="players">Connecting…</div></aside><section class="stage"><div class="hud"><span id="status">CONNECTING</span><span id="level">LEVEL 1</span></div><div class="arena" id="arena"><div class="safe"></div><div class="msg" id="msg"><div><strong>Ready when you are</strong>Join the arena to begin.</div></div></div><div class="touch-controls"><div class="touch-pad"><button class="touch-key" data-key="w">▲</button><button class="touch-key" data-key="a">◀</button><button class="touch-key" data-key="s">▼</button><button class="touch-key" data-key="d">▶</button></div><button class="fire-key" id="fire">FIRE</button></div><div class="controls">Move: WASD or arrow keys · Aim: move your pointer · Fire: click or Space</div></section></div></main>
<script>
const arena=document.querySelector('#arena'),msg=document.querySelector('#msg'),statusEl=document.querySelector('#status'),levelEl=document.querySelector('#level'),playersEl=document.querySelector('#players'),joinBtn=document.querySelector('#join'),leaveBtn=document.querySelector('#leave'),nameInput=document.querySelector('#name');
const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);let myId='',room='',statePlayers=[],keys={},mouse={x:450,y:280},shoot=false,joined=false;
document.querySelectorAll('.touch-key').forEach(btn=>{const key=btn.dataset.key;const down=e=>{e.preventDefault();keys[key]=true;btn.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();keys[key]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});const fireBtn=document.querySelector('#fire');fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();shoot=true;fireBtn.setPointerCapture?.(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])fireBtn.addEventListener(ev,e=>{e.preventDefault();shoot=false});
function send(x){if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(x))}
ws.onopen=()=>{statusEl.textContent='CONNECTED';send({type:'name',name:nameInput.value});};ws.onclose=()=>{statusEl.textContent='DISCONNECTED — RELOAD TO TRY AGAIN';msg.classList.remove('hidden');msg.innerHTML='<div><strong>Connection lost</strong>Refresh the page to reconnect.</div>';};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='hello')myId=m.id;if(m.type==='lobby'){playersEl.textContent=`${m.players.length} player${m.players.length===1?'':'s'} online`;}if(m.type==='state'){room=m.room;statePlayers=m.players;levelEl.textContent=`LEVEL ${m.level}`;statusEl.textContent=m.state==='playing'?'MATCH IN PROGRESS':'WAITING FOR PLAYERS';draw();}};
nameInput.addEventListener('change',()=>send({type:'name',name:nameInput.value}));joinBtn.onclick=()=>{send({type:'name',name:nameInput.value||'Player'});send({type:'join',room:'open-arena'});joined=true;joinBtn.classList.add('hidden');leaveBtn.classList.remove('hidden');msg.classList.add('hidden');};leaveBtn.onclick=()=>{send({type:'leave'});joined=false;joinBtn.classList.remove('hidden');leaveBtn.classList.add('hidden');msg.classList.remove('hidden');msg.innerHTML='<div><strong>You left the arena</strong>Join again when ready.</div>';};
function draw(){arena.querySelectorAll('.player,.label').forEach(n=>n.remove());for(const p of statePlayers){const x=p.x/900*arena.clientWidth,y=p.y/560*arena.clientHeight;const dot=document.createElement('div');dot.className='player'+(p.id===myId?' me':'');dot.style.left=x+'px';dot.style.top=y+'px';dot.style.color=p.color;dot.style.background=p.alive?p.color:'#333';arena.append(dot);const label=document.createElement('div');label.className='label';label.style.left=x+'px';label.style.top=y+'px';label.textContent=`${p.name} · ${p.hp} HP`;arena.append(label);}const alive=statePlayers.filter(p=>p.alive);if(statePlayers.length>1&&alive.length<=1){msg.classList.remove('hidden');msg.innerHTML=`<div><strong>${alive[0]?.id===myId?'Victory!':'Round over'}</strong>Next level starts in a few seconds.</div>`;}else if(joined)msg.classList.add('hidden');}
function pos(e){const r=arena.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*900;mouse.y=(e.clientY-r.top)/r.height*560;}arena.addEventListener('pointermove',pos);arena.addEventListener('pointerdown',()=>shoot=true);window.addEventListener('pointerup',()=>shoot=false);window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){shoot=true;e.preventDefault();}});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')shoot=false;});
setInterval(()=>{if(!joined||!myId)return;const p=statePlayers.find(p=>p.id===myId);if(!p)return;let x=p.x,y=p.y,step=5;if(keys.w||keys.arrowup)y-=step;if(keys.s||keys.arrowdown)y+=step;if(keys.a||keys.arrowleft)x-=step;if(keys.d||keys.arrowright)x+=step;send({type:'move',x,y,shoot});},50);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script></body></html>
